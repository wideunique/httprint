# Copy this file to `config.yaml` and adjust values as needed.
port: 7777
address: ""

# Directories for queued and archived jobs
queue_dir: queue
archive: true
archive_dir: archive

# Printing behaviour
print_with_code: true
pdf_only: true
check_pdf_pages: true
print_cmd: "lp -n %(copies)s -o sides=%(sides)s -o media=%(media)s"

# Job metadata
code_digits: 4
max_pages: 10

# Runtime toggles
demo: false
debug: false

# Network access control
ip_whitelist:
  - 127.0.0.1/32
  - ::1/128
auth_username: "printer"
auth_password: "change-me"
