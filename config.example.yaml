# Copy this file to `config.yaml` and adjust values as needed.
port: 7777
address: ""

# Directories for queued and archived jobs
queue_dir: queue
archive: true
archive_dir: archive

# Printing behaviour
pdf_only: true
check_pdf_pages: true
print_cmd: "lp -n %(copies)s -o sides=%(sides)s -o media=%(media)s"

# Job metadata
max_pages: 10

# Runtime toggles
demo: false
debug: false
